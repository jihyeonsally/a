    wrap.style.display = "block";
    document.querySelectorAll("#payerChips .chip").forEach(b => b.classList.toggle("active", b.dataset.payer === state.modalPayer));
  } else {
    // 지현/현제 가계부는 결제자가 가계부 주인으로 고정되므로 선택 UI 숨김
    wrap.style.display = "none";
    state.modalPayer = state.modalTargetLedger;
  }
}

// 지현/현제 가계부는 지출만 기록하므로, 추가 대상 가계부가 공용일 때만
// 지출/수입/투자 타입 선택 UI 자체를 노출한다. 공용이 아닌 가계부로 바뀌면
// 자동으로 지출로 고정한다. 자산 내역은 자산 화면 전용 입력이라 타입을
// 바꿀 필요가 없으므로 세그먼트 자체를 항상 숨긴다.
function updateTypeSegmentVisibility() {
  const segment = document.getElementById("typeSegment");
  const investBtn = document.getElementById("typeInvestmentBtn");
  const isShared = state.modalTargetLedger === "shared";
  if (state.modalType === "asset") {
    segment.style.display = "none";
    return;
  }
  segment.style.display = isShared ? "flex" : "none";
  investBtn.style.display = isShared ? "" : "none";
  if (!isShared && (state.modalType === "income" || state.modalType === "investment")) {
    state.modalType = "expense";
    state.modalCategory = defaultCategoryFor(state.modalTargetLedger, state.modalType);
    document.querySelectorAll("#typeSegment button").forEach(b => b.classList.toggle("active", b.dataset.type === state.modalType));
  }
}

function closeModal() { overlay.classList.remove("show"); }
document.getElementById("closeSheet").addEventListener("click", closeModal);
overlay.addEventListener("click", (e) => { if (e.target === overlay) closeModal(); });
document.getElementById("fabAdd").addEventListener("click", () => openModal(state.selectedDate || ymd(new Date())));

memoInput.addEventListener("input", () => {
  state.modalMemo = memoInput.value;
});

amountInput.addEventListener("input", () => {
  const digits = amountInput.value.replace(/[^0-9]/g, "");
  amountInput.value = digits ? Number(digits).toLocaleString("ko-KR") : "";
  updateSaveEnabled();
});

document.querySelectorAll("#typeSegment button").forEach(btn => {
  btn.addEventListener("click", () => {
    state.modalType = btn.dataset.type;
    state.modalCategory = defaultCategoryFor(state.modalTargetLedger, state.modalType);
    document.querySelectorAll("#typeSegment button").forEach(b => b.classList.remove("active"));
    btn.classList.add("active");
    renderCategoryChips();
    updateSaveEnabled();
  });
});

document.getElementById("payerChips").addEventListener("click", (e) => {
  const chip = e.target.closest(".chip");
  if (!chip) return;
  state.modalPayer = chip.dataset.payer;
  document.querySelectorAll("#payerChips .chip").forEach(c => c.classList.remove("active"));
  chip.classList.add("active");
});

function renderTargetLedgerChips() {
  const wrap = document.getElementById("targetLedgerWrap");
  wrap.style.display = (state.modalTargetLedger === "shared" && state.modalType !== "asset") ? "block" : "none";

  const el = document.getElementById("targetLedgerChips");
  el.innerHTML = LEDGERS.map(l => `
    <button class="chip ${l.id === state.modalTargetLedger ? "active" : ""}" data-ledger="${l.id}">${l.label.replace(" 가계부","")}</button>
  `).join("");
  el.querySelectorAll(".chip").forEach(chip => {
    chip.addEventListener("click", () => {
      state.modalTargetLedger = chip.dataset.ledger;
      el.querySelectorAll(".chip").forEach(c => c.classList.remove("active"));
      chip.classList.add("active");
      updateTypeSegmentVisibility(); // 공용이 아니면 지출로 고정
      state.modalCategory = defaultCategoryFor(state.modalTargetLedger, state.modalType);
      updatePayerFieldVisibility();
      renderCategoryChips();
      updateSaveEnabled();
    });
  });
}

function renderCategoryChips() {
  const el = document.getElementById("categoryChips");
  const cats = categoriesForLedger(state.modalTargetLedger)[state.modalType] || [];
  el.innerHTML = cats.map(c => `
    <button class="chip ${c.id === state.modalCategory ? "active" : ""}" data-cat="${c.id}">${c.icon} ${c.label}</button>
  `).join("");
  el.querySelectorAll(".chip").forEach(chip => {
    chip.addEventListener("click", () => {
      state.modalCategory = chip.dataset.cat;
      el.querySelectorAll(".chip").forEach(c => c.classList.remove("active"));
      chip.classList.add("active");
      updateSaveEnabled();
    });
  });
}

function currentAmount() {
  return Number(amountInput.value.replace(/[^0-9]/g, "")) || 0;
}

function updateSaveEnabled() {
  saveBtn.disabled = !(currentAmount() > 0 && state.modalCategory && state.modalTargetLedger && dateInput.value);
}
dateInput.addEventListener("change", updateSaveEnabled);

saveBtn.addEventListener("click", async () => {
  if (saveBtn.disabled) return;
  saveBtn.disabled = true;
  saveBtn.textContent = "저장 중...";

  const editing = state.editingEntry;
  const entry = {
    id: editing ? editing.original.id : (crypto.randomUUID ? crypto.randomUUID() : String(Date.now()) + Math.random().toString(16).slice(2)),
    date: dateInput.value,
    type: state.modalType,
    amount: currentAmount(),
    category: state.modalCategory,
    payer: state.modalPayer,
    memo: (state.modalMemo || "").trim().slice(0, 10),
    createdAt: editing ? editing.original.createdAt : Date.now(),
  };

  try {
    if (editing) await deleteEntry(editing.original, editing.ledgerId);
    await saveEntry(entry, state.modalTargetLedger);
    closeModal();
  } catch (err) {
    console.error("저장 실패:", err);
    alert("저장에 실패했습니다. Firebase 설정을 확인해주세요.\n" + err.message);
  } finally {
    saveBtn.textContent = "저장";
    updateSaveEnabled();
  }
});

deleteEntryBtn.addEventListener("click", async () => {
  if (!state.editingEntry) return;
  if (!confirm("이 내역을 삭제할까요?")) return;

  deleteEntryBtn.disabled = true;
  saveBtn.disabled = true;
  try {
    await deleteEntry(state.editingEntry.original, state.editingEntry.ledgerId);
    closeModal();
  } catch (err) {
    console.error("삭제 실패:", err);
    alert("삭제에 실패했습니다.\n" + err.message);
  } finally {
    deleteEntryBtn.disabled = false;
    updateSaveEnabled();
  }
});

duplicateEntryBtn.addEventListener("click", () => {
  if (!state.editingEntry) return;
  openModal(ymd(new Date()), {
    type: state.modalType,
    targetLedger: state.modalTargetLedger,
    payer: state.modalPayer,
    category: state.modalCategory,
    memo: state.modalMemo,
    amount: currentAmount(),
  });
});

/* ====================== 메모 검색 ====================== */
const searchOverlay = document.getElementById("searchOverlay");
const searchInput = document.getElementById("searchInput");
const searchResults = document.getElementById("searchResults");
let searchAllEntries = [];

async function openSearch() {
  searchOverlay.classList.add("show");
  searchInput.value = "";
  searchResults.innerHTML = `<div class="day-detail-empty">불러오는 중...</div>`;

  const prefix = `${state.currentLedger}_`;
  try {
    const snap = await db.collection(COLLECTION)
      .where(firebase.firestore.FieldPath.documentId(), ">=", prefix)
      .where(firebase.firestore.FieldPath.documentId(), "<", prefix + "")
      .get();
    searchAllEntries = [];
    snap.forEach(doc => {
      const data = doc.data();
      if (data && data.entries) searchAllEntries = searchAllEntries.concat(data.entries);
    });
  } catch (err) {
    console.error("검색 데이터 로드 실패:", err);
    searchAllEntries = [];
  }
  renderSearchResults();
  searchInput.focus();
}

function closeSearch() {
  searchOverlay.classList.remove("show");
}

function renderSearchResults() {
  const query = searchInput.value.trim();
  if (!query) {
    searchResults.innerHTML = `<div class="day-detail-empty">메모로 검색해보세요.</div>`;
    return;
  }

  const q = query.toLowerCase();
  const matched = searchAllEntries
    .filter(e => e.memo && e.memo.toLowerCase().includes(q))
    .sort((a, b) => (b.date || "").localeCompare(a.date || "") || (b.createdAt || 0) - (a.createdAt || 0));

  if (matched.length === 0) {
    searchResults.innerHTML = `<div class="day-detail-empty">검색 결과가 없습니다.</div>`;
    return;
  }

  searchResults.innerHTML = matched.map(e => {
    const cat = (categoriesForLedger(state.currentLedger)[e.type] || []).find(c => c.id === e.category);
    const icon = cat ? cat.icon : "📦";
    const name = cat ? cat.label : e.category;
    const sign = (e.type === "income" || e.type === "asset") ? "+" : "-";
    const [y, m, d] = (e.date || "").split("-").map(Number);
    const dateLabel = m && d ? `<span class="${weekdayClass(new Date(y, m - 1, d).getDay())}">${m}/${d}</span>` : "";
    return `
      <div class="day-detail-row">
        <span class="search-date mono">${dateLabel}</span>
        <span class="icon">${icon}</span>
        <span class="name">${name}${e.memo ? ` <span class="entry-memo-inline">· ${escapeHtml(e.memo)}</span>` : ""}</span>
        <span class="amt ${e.type}">${sign}${fmtNum(e.amount)}원</span>
      </div>`;
  }).join("");
}

document.getElementById("searchBtn").addEventListener("click", openSearch);
document.getElementById("closeSearchSheet").addEventListener("click", closeSearch);
searchOverlay.addEventListener("click", (e) => { if (e.target === searchOverlay) closeSearch(); });
searchInput.addEventListener("input", renderSearchResults);

/* ====================== 초기화 ====================== */
renderLedgerToggle();
updateLedgerToggleVisibility("calendar");
updateDashTypeVisibility();
if (state.currentLedger !== "shared") state.chartMetric = "expense";
updateChartMetricVisibility();
renderMonthSummary();
listenCalendarMonth(state.currentLedger, state.calDate);
listenDashboardMonth(state.currentLedger, state.dashDate);
listenAssetStructure(ASSET_LEDGER_KEY);
listenAssetMonthValues(ASSET_LEDGER_KEY, state.assetsDate);
</script>
