<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0" />
<title>지현제 가계부</title>
<link rel="icon" type="image/png" href="icons/icon-32.png" />
<link rel="apple-touch-icon" href="icons/icon-180.png" />

<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500;600;700&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet" />

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>

<style>
  :root{
    --bg: #E7F7F8;
    --card: #FFFFFF;
    --text: #1F2E2A;
    --text-dim: #6B9086;
    --accent: #3EC0D4;
    --accent-soft: #D8F5F1;
    --expense: #C93F6E;
    --expense-soft: #FBD9E3;
    --income: #2F9E75;
    --income-soft: #D9F0E3;
    --invest: #7C5CBF;
    --invest-soft: #E9E1F7;
    --border: #D4EFE6;
    --saturday: #3B6FD6;
    --sunday: #D64545;
    --radius: 16px;
    --radius-sm: 10px;
    --shadow: 0 2px 8px rgba(31,46,42,0.06);
  }
  *{ box-sizing: border-box; }
  html,body{
    margin:0; padding:0;
    background: var(--bg);
    color: var(--text);
    font-family: "IBM Plex Sans KR", -apple-system, sans-serif;
    -webkit-font-smoothing: antialiased;
    overflow-x: hidden;
  }
  .mono{ font-family: "Space Mono", monospace; }
  #app{
    max-width: 640px;
    margin: 0 auto;
    min-height: 100vh;
    background: var(--bg);
    position: relative;
    padding-bottom: 76px;
  }

  /* ---------- Top ledger switcher ---------- */
  .topbar{
    position: sticky; top:0; z-index: 20;
    background: var(--bg);
    padding: 10px 16px 8px;
    display:flex; align-items:center; justify-content:space-between; gap:12px;
  }
  .site-title-wrap{ display:flex; align-items:center; gap:8px; min-width:0; }
  .site-title-icon{ width:32px; height:32px; object-fit:contain; flex-shrink:0; }
  .site-title{ font-size:16px; font-weight:700; color: var(--text); white-space:nowrap; letter-spacing:0.4px; }
  .ledger-toggle{
    display:flex; gap:4px;
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 999px;
    padding: 4px;
    width: fit-content;
    flex-shrink:0;
    box-shadow: var(--shadow);
  }
  .ledger-toggle-btn{
    border:none; background:none; border-radius:999px;
    padding: 7px 14px; font-family: inherit; font-weight:700; font-size:12px;
    color: var(--text-dim); cursor:pointer; white-space:nowrap;
  }
  .ledger-toggle-btn.active{ background: var(--accent); color:#fff; }

  /* ---------- Month summary ---------- */
  .month-summary{ padding: 4px 16px 8px; }
  .summary-top{
    display:flex; align-items:center; justify-content:space-between; gap:12px;
    margin-bottom: 14px;
  }
  .summary-remaining{ font-size:24px; font-weight:700; color: var(--text); line-height:1.1; }
  .search-btn{
    width:36px; height:36px; border-radius:50%; border:1px solid var(--border);
    background: var(--card); display:flex; align-items:center; justify-content:center;
    cursor:pointer; font-size:15px; flex-shrink:0;
  }
  .search-btn:hover{ background: var(--accent-soft); }
  .summary-row{
    display:flex; flex-wrap:nowrap; align-items:center; justify-content:space-between;
    gap:8px; padding: 3px 0; font-size:15px; overflow:hidden;
  }
  .summary-item{ display:flex; align-items:center; gap:4px; min-width:0; }
  .summary-label{ font-weight:600; color: var(--text-dim); white-space:nowrap; flex-shrink:0; }
  .summary-label.income{ color: var(--income); }
  .summary-label.expense{ color: var(--expense); }
  .summary-label.investment{ color: var(--invest); }
  .summary-amt{
    font-weight:600; color: var(--text-dim); white-space:nowrap;
    overflow:hidden; text-overflow:ellipsis;
  }
  .summary-amt.income{ color: var(--income); }
  .summary-amt.expense{ color: var(--expense); }
  .summary-amt.investment{ color: var(--invest); }

  /* ---------- Calendar screen ---------- */
  .month-nav{
    display:flex; align-items:center; justify-content:space-between;
    padding: 4px 16px 16px;
  }
  .month-nav h2{ font-size: 16px; margin:0 0 0 4px; font-weight:700; line-height:1; }
  .month-nav .navbtns{ display:flex; align-items:center; gap:4px; }
  .navbtn{
    width:32px; height:32px; border-radius:50%; border:1px solid var(--border);
    background: var(--card); display:flex; align-items:center; justify-content:center;
    cursor:pointer; font-size:14px; line-height:1; color: var(--text); padding:0;
  }
  .navbtn:hover{ background: var(--accent-soft); }

  .weekdays{
    display:grid; grid-template-columns: repeat(7, minmax(0,1fr));
    padding: 0 12px; margin-bottom: 4px;
  }
  .weekdays span{
    text-align:center; font-size:11px; color: var(--text); font-weight:600;
  }
  .wd-sat{ color: var(--saturday); }
  .wd-sun{ color: var(--sunday); }
  .calendar-grid{
    display:grid; grid-template-columns: repeat(7, minmax(0,1fr));
    gap: 4px; padding: 0 12px;
  }
  .day-cell{
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 10px;
    min-height: 68px;
    min-width: 0;
    padding: 6px 5px;
    cursor:pointer;
    display:flex; flex-direction:column; align-items:center; gap:3px;
    overflow:hidden;
    transition: border-color .1s;
  }
  .day-cell:hover{ border-color: var(--accent); }
  .day-cell.empty{ background:transparent; border-color:transparent; cursor:default; }
  .day-cell.today{ border-color: var(--accent); border-width:2px; }
  .day-cell.selected{ background: var(--accent-soft); border-color: var(--accent); }
  .day-num{ font-size:12px; font-weight:600; color: var(--text); text-align:center; }
  .day-cell.today .day-num{ color: var(--accent); }
  .day-entries{
    display:flex; flex-direction:row; flex-wrap:nowrap; align-items:center; justify-content:center;
    gap:4px; width:100%; overflow:hidden; font-size:9px;
  }
  .day-line{
    font-size:inherit; line-height:1.3; overflow:hidden; text-overflow:ellipsis;
    white-space:nowrap; font-weight:600; text-align:center; max-width:100%;
  }
  .day-line.expense{ color: var(--expense); }
  .day-line.income{ color: var(--income); }
  .day-line.investment{ color: var(--invest); }

  /* ---------- Day detail panel ---------- */
  .day-detail{ margin: 12px 16px 20px; }
  .day-detail-title{ font-size:13px; font-weight:700; color: var(--text-dim); margin-bottom:8px; }
  .day-detail-empty{
    font-size:13px; color: var(--text-dim); padding: 18px 0; text-align:center;
    background: var(--card); border:1px solid var(--border); border-radius: var(--radius-sm);
  }
  .day-detail-row{
    display:flex; align-items:center; gap:10px;
    background: var(--card); border:1px solid var(--border); border-radius: var(--radius-sm);
    padding: 12px 14px; margin-bottom:8px; cursor:pointer;
  }
  .day-detail-row:hover{ border-color: var(--accent); }
  .day-detail-row .icon{ font-size:16px; width:24px; text-align:center; }
  .day-detail-row .name{ flex:1; font-size:14px; font-weight:600; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .day-detail-row .entry-memo-inline{ font-size:12px; font-weight:400; color: var(--text-dim); }
  .day-detail-row .amt{ font-weight:700; font-size:14px; }
  .day-detail-row .amt.expense{ color: var(--expense); }
  .day-detail-row .amt.income{ color: var(--income); }
  .day-detail-row .amt.investment{ color: var(--invest); }
  .day-detail-row .amt.asset{ color: var(--income); }

  /* ---------- Bottom tab bar ---------- */
  .tabbar{
    position: fixed; bottom:0; left:50%; transform: translateX(-50%);
    width:100%; max-width:640px;
    background: var(--card);
    border-top: 1px solid var(--border);
    display:flex; z-index: 20;
  }
  .tabbtn{
    flex:1; border:none; background:none; padding: 20px 0;
    font-family: inherit; color: var(--text-dim);
    display:flex; align-items:center; justify-content:center; cursor:pointer;
  }
  .tabbtn .icon{ font-size:20px; }
  .tabbtn.active{ color: var(--accent); }
  .tab-add{ position:relative; }
  .tab-add .add-icon{
    position:absolute; top:-16px; left:50%; transform:translateX(-50%);
    width:44px; height:44px; border-radius:50%;
    background: var(--accent); color:#fff; border:3px solid var(--card);
    display:flex; align-items:center; justify-content:center;
    font-size:24px; line-height:1; box-shadow: 0 4px 10px rgba(62,192,212,0.4);
  }

  .screen{ display:none; }
  .screen.active{ display:block; }

  /* ---------- Dashboard ---------- */
  .dash-toggle{
    display:flex; align-items:center; justify-content:space-between; gap:12px;
    padding: 4px 16px 18px;
  }
  .dash-total{ font-size:24px; font-weight:700; color: var(--text); line-height:1.1; }
  .dash-type-toggle{
    display:flex; gap:4px; background: var(--card); border:1px solid var(--border);
    border-radius:999px; padding:4px; flex-shrink:0;
  }
  .dash-type-toggle button{
    border:none; background:none; border-radius:999px; padding: 7px 14px;
    font-family: inherit; font-weight:700; font-size:12px; color: var(--text-dim); cursor:pointer;
  }
  .dash-type-toggle button.active.expense{ background: var(--expense); color:#fff; }
  .dash-type-toggle button.active.income{ background: var(--income); color:#fff; }
  .dash-type-toggle button.active.investment{ background: var(--invest); color:#fff; }
  .dash-type-toggle button.active.all{ background: var(--accent); color:#fff; }

  .payer-nav-row{
    display:flex; align-items:center; gap:8px; padding: 0 16px 16px;
  }
  .payer-nav-row .navbtns{ display:flex; align-items:center; gap:4px; flex-shrink:0; margin-left:auto; }
  #payerFilter.chip-row{ gap:6px; }
  #payerFilter .chip{ padding:6px 12px; font-size:12px; }
  #quickAddRow.chip-row{ gap:6px; }
  #quickAddRow .chip{ padding:6px 12px; font-size:12px; }

  .assets-daterange-row{
    display:flex; align-items:center; gap:8px; padding: 0 16px 12px;
  }
  .assets-month-select{
    flex:1; min-width:0; padding: 9px 10px; border-radius:12px; border:1px solid var(--border);
    background: var(--card); font-family: inherit; font-size:13px; color: var(--text); outline:none;
  }
  .assets-daterange-sep{ color: var(--text-dim); font-weight:600; flex-shrink:0; }

  #assetOwnerFilter.chip-row{ gap:6px; flex:1; justify-content:flex-end; flex-wrap:wrap; }
  #assetOwnerFilter .chip{ padding:6px 10px; font-size:12px; }
  #manageAssetBtn{
    background:none; border:none; padding:4px; font-size:20px; line-height:1;
    cursor:pointer; flex-shrink:0; display:flex; align-items:center; justify-content:center;
  }

  .assets-range-row{ padding: 0 16px 16px; }
  #chartMetricFilter.chip-row{ gap:6px; }
  #chartMetricFilter .chip{ padding:6px 12px; font-size:12px; }
  #chartMetricFilter .chip.active.all{ background: var(--accent); color:#fff; border-color: var(--accent); }
  #chartMetricFilter .chip.active.balance{ background: var(--accent); color:#fff; border-color: var(--accent); }
  #chartMetricFilter .chip.active.expense{ background: var(--expense); color:#fff; border-color: var(--expense); }
  #chartMetricFilter .chip.active.income{ background: var(--income); color:#fff; border-color: var(--income); }
  #chartMetricFilter .chip.active.investment{ background: var(--invest); color:#fff; border-color: var(--invest); }


  .dash-card{
    margin: 0 16px 16px;
    background: var(--card); border:1px solid var(--border); border-radius: var(--radius);
    padding: 16px; box-shadow: var(--shadow);
    display:flex; flex-direction:column; align-items:center; justify-content:center;
  }
  .chart-wrap{ width:100%; max-width:220px; margin:0 auto; }
  .trend-chart-wrap{ width:100%; }
  .trend-chart-wrap svg{ width:100%; height:auto; display:block; }
  .chart-legend{
    display:flex; flex-wrap:wrap; gap:10px; justify-content:center;
    margin-top:10px; font-size:11px; color: var(--text-dim);
  }
  .chart-legend .legend-item{ display:flex; align-items:center; gap:4px; }
  .chart-legend i{ width:8px; height:8px; border-radius:2px; display:inline-block; }
  .donut-wrap{ position:relative; }
  .donut-wrap svg{ width:100%; height:auto; display:block; }
  .donut-callouts{ position:absolute; inset:0; pointer-events:none; }
  .donut-center-label{
    position:absolute; left:50%; top:50%; transform:translate(-50%,-50%);
    font-family:"Space Mono", monospace; font-weight:700; font-size:15px;
    color: var(--text); pointer-events:none;
  }
  .donut-callout{
    position:absolute; transform:translate(-50%,-50%);
    display:flex; align-items:center; gap:3px; white-space:nowrap;
  }
  .donut-callout .icon{ font-size:13px; }
  .dash-empty{ text-align:center; color: var(--text-dim); font-size:13px; padding: 24px 0; }
  .dash-warning{
    margin: 0 16px 12px; padding: 10px 14px; border-radius: var(--radius-sm);
    background: #FFEA00; color: #B21807; font-weight:700; font-size:13px;
    text-align:center; box-shadow: 0 0 0 1px #FFC400, 0 2px 10px rgba(255,196,0,0.55);
  }

  .cat-list{ margin: 0 16px; display:flex; flex-direction:column; gap:8px; }
  .cat-row-wrap{
    background: var(--card); border:1px solid var(--border); border-radius: var(--radius-sm);
    overflow:hidden;
  }
  .cat-row{
    display:flex; align-items:center; gap:10px; width:100%;
    border:none; background:none; font-family:inherit; text-align:left;
    padding: 12px 14px; cursor:pointer;
  }
  .cat-row .icon{ font-size:18px; width:26px; text-align:center; flex-shrink:0; }
  .cat-row .name{ flex:1; font-size:14px; font-weight:600; color: var(--text); }
  .cat-row .amt{ font-weight:700; font-size:14px; }
  .cat-row .amt.expense{ color: var(--expense); }
  .cat-row .amt.income{ color: var(--income); }
  .cat-row .amt.investment{ color: var(--invest); }
  .cat-row .chevron{ font-size:10px; color: var(--text-dim); flex-shrink:0; }

  .cat-entries{ border-top:1px solid var(--border); padding: 4px 14px 8px; }
  .cat-entry-row{
    display:flex; align-items:center; gap:10px; padding: 7px 0;
    font-size:13px; cursor:pointer;
  }
  .cat-entry-row:hover .entry-memo{ color: var(--accent); }
  .cat-entry-row .search-date{ width:42px; flex-shrink:0; color: var(--text); }
  .cat-entry-row .entry-memo{ flex:1; color: var(--text); overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .cat-entry-row .amt{ font-weight:600; font-size:13px; }
  .cat-entry-row .amt.expense{ color: var(--expense); }
  .cat-entry-row .amt.income{ color: var(--income); }
  .cat-entry-row .amt.investment{ color: var(--invest); }
  .owner-tag{
    flex-shrink:0; font-size:11px; font-weight:700; padding:2px 6px; border-radius:6px;
  }
  .owner-tag.owner-shared{ color:#D97757; background: rgba(217,119,87,0.14); }
  .owner-tag.owner-jihyeon{ color:#B8960C; background: rgba(184,150,12,0.16); }
  .owner-tag.owner-hyeonje{ color:#5B7FA6; background: rgba(91,127,166,0.14); }

  .value-cell{ display:inline-flex; align-items:center; flex-shrink:0; }
  .cell-display{
    cursor:pointer; font-weight:600; font-size:13px; color: var(--text);
    padding: 4px 8px; border-radius:8px;
  }
  .cell-display:hover{ background: var(--accent-soft); }
  .cell-input{
    width:100px; padding: 5px 8px; border-radius:8px; border:1px solid var(--accent);
    background: var(--card); font-family: inherit; font-size:13px; color: var(--text);
    text-align:right; outline:none;
  }

  /* ---------- Modal ---------- */
  .overlay{
    position: fixed; inset:0; background: rgba(31,46,42,0.4);
    display:none; align-items:flex-end; justify-content:center; z-index: 50;
    overflow-x:hidden;
  }
  .overlay.show{ display:flex; }
  .sheet{
    background: var(--bg); width:100%; max-width:640px;
    border-radius: 24px 24px 0 0;
    max-height: 90vh;
    display:flex; flex-direction:column;
    overflow:hidden;
  }
  .sheet-header{ position:relative; padding: 20px 20px 0; flex-shrink:0; }
  .sheet-body{ padding: 0 20px 20px; overflow-y:auto; overflow-x:hidden; flex:1; min-height:0; }
  .sheet-footer{
    flex-shrink:0; display:flex; flex-direction:column; gap:10px;
    padding: 14px 20px calc(14px + env(safe-area-inset-bottom));
    border-top:1px solid var(--border); background: var(--bg);
  }
  .sheet-handle{ width:36px; height:4px; background: var(--border); border-radius:2px; margin: 0 auto 16px; }
  .sheet h3{ margin: 0 0 18px; font-size:17px; font-weight:700; text-align:center; }

  .amount-input{
    width:100%; border:none; background:none; text-align:center;
    font-family:"Space Mono", monospace; font-size:40px; font-weight:700;
    color: var(--text); padding: 8px 0 20px; outline:none;
  }
  .amount-input::placeholder{ color: var(--border); }

  .segmented{ display:flex; gap:8px; margin-bottom:16px; }
  .segmented button{
    flex:1; padding:11px 0; border-radius:12px; border:1px solid var(--border);
    background: var(--card); font-family:inherit; font-weight:700; font-size:14px;
    color: var(--text-dim); cursor:pointer;
  }
  .segmented button.active.expense{ background: var(--expense-soft); color: var(--expense); border-color: var(--expense); }
  .segmented button.active.income{ background: var(--income-soft); color: var(--income); border-color: var(--income); }
  .segmented button.active.investment{ background: var(--invest-soft); color: var(--invest); border-color: var(--invest); }

  .field-label{ font-size:12px; font-weight:700; color: var(--text-dim); margin: 14px 0 8px; }

  .chip-row{ display:flex; flex-wrap:wrap; gap:8px; }
  .chip{
    padding: 8px 13px; border-radius:999px; border:1px solid var(--border);
    background: var(--card); font-family:inherit; font-size:13px; font-weight:600;
    color: var(--text); cursor:pointer;
  }
  .chip.active{ background: var(--accent); color:#fff; border-color: var(--accent); }

  input[type="date"], #memoInput, #searchInput{
    width:100%; padding: 11px 13px; border-radius:12px; border:1px solid var(--border);
    background: var(--card); font-family: inherit; font-size:14px; color: var(--text);
    outline: none;
  }
  #memoInput::placeholder, #searchInput::placeholder{ color: var(--text-dim); }

  .manage-cat-block{ padding: 10px 0; border-bottom:1px solid var(--border); background: var(--bg); }
  .manage-cat-block:last-of-type{ border-bottom:none; }
  .manage-cat-header{ display:flex; align-items:center; gap:6px; }
  .manage-name-wrap{ flex:1; min-width:0; cursor:pointer; }
  .manage-name{ display:block; font-weight:600; font-size:14px; color: var(--text); overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .manage-name-input{
    width:100%; padding:4px 6px; border-radius:6px; border:1px solid var(--accent);
    background: var(--card); font-family:inherit; font-size:14px; font-weight:600; color: var(--text); outline:none;
  }
  .manage-items{ display:flex; flex-direction:column; gap:2px; padding-left:14px; margin-top:6px; }
  .manage-item-row{ display:flex; align-items:center; gap:6px; padding:6px 0; font-size:13px; background: var(--bg); }
  .manage-item-row .manage-name{ font-weight:500; font-size:13px; }
  .manage-item-row .manage-name-input{ font-size:13px; font-weight:500; }
  .manage-del-btn{
    border:none; background:none; color: var(--expense); font-family:inherit; font-size:12px;
    font-weight:700; cursor:pointer; padding:4px 8px; flex-shrink:0;
  }
  .drag-handle{
    cursor: grab; color: var(--text-dim); font-size:15px; line-height:1; padding:4px 4px;
    touch-action: none; flex-shrink:0; user-select:none;
  }
  .manage-cat-block.dragging, .manage-item-row.dragging{ opacity:0.45; }
  .manage-add-btn{
    border:1px dashed var(--border); background:none; color: var(--accent); font-family:inherit;
    font-size:12px; font-weight:700; cursor:pointer; padding:6px 10px; border-radius:8px; margin-top:6px;
  }
  .manage-add-cat-btn{ width:100%; margin: 14px 0 4px; }
  .manage-add-row{ display:flex; gap:6px; align-items:center; margin-top:6px; }
  .manage-draft-input{
    flex:1; min-width:0; padding:7px 10px; border-radius:8px; border:1px solid var(--accent);
    background: var(--card); font-family: inherit; font-size:13px; color: var(--text); outline:none;
  }
  .manage-confirm-btn{
    border:none; background: var(--accent); color:#fff; font-family:inherit; font-weight:700;
    font-size:12px; padding:7px 12px; border-radius:8px; cursor:pointer; flex-shrink:0;
  }
  .manage-owner-select{
    flex-shrink:0; padding:7px 6px; border-radius:8px; border:1px solid var(--accent);
    background: var(--card); font-family: inherit; font-size:12px; color: var(--text); outline:none;
  }
  .manage-icon-select{
    flex-shrink:0; padding:4px 2px; border-radius:8px; border:1px solid var(--accent);

function categoriesForLedger(ledgerId) {
  if (ledgerId === "shared") return CATEGORIES_SHARED;
  if (ledgerId === "hyeonje") return CATEGORIES_HYEONJE;
  return CATEGORIES_JIHYEON;
}

// 내역 추가 시 타입별로 기본 선택될 카테고리 (수입→급여, 투자→ISA, 자산→자산, 공용 지출→식료품)
function defaultCategoryFor(targetLedger, type) {
  const cats = categoriesForLedger(targetLedger)[type] || [];
  const preferred = type === "income" ? "salary" : type === "investment" ? "isa" : type === "asset" ? "asset_etc" : (targetLedger === "shared" ? "groceries" : null);
  return (preferred && cats.some(c => c.id === preferred)) ? preferred : null;
}

/* ====================== Firestore 연동 (월별 문서 샤딩) ======================
   문서 경로: ledger_v1/{ledgerId}_{YYYY-MM}  (예: ledger_v1/jihyeon_2026-08)
   달력 화면과 대시보드 화면이 서로 다른 월을 보고 있을 수 있으므로
   두 화면은 각각 독립적인 Firestore 구독(listener)을 가진다.
============================================================================ */
function monthKeyOf(dateObj) {
  return `${dateObj.getFullYear()}-${String(dateObj.getMonth() + 1).padStart(2, "0")}`;
}
function monthDocId(ledgerId, monthKey) {
  return `${ledgerId}_${monthKey}`;
}

function listenCalendarMonth(ledgerId, dateObj) {
  if (state.calUnsub) state.calUnsub();
  const docId = monthDocId(ledgerId, monthKeyOf(dateObj));
  state.calUnsub = db.collection(COLLECTION).doc(docId).onSnapshot((snap) => {
    const data = snap.data();
    state.calEntries = (data && data.entries) ? data.entries.slice() : [];
    renderCalendar();
    renderDayDetail();
    renderMonthSummary();
    flashSync();
  }, (err) => {
    console.error("Firestore listen error (calendar):", err);
  });
}

function listenDashboardMonth(ledgerId, dateObj) {
  if (state.dashUnsub) state.dashUnsub();
  const docId = monthDocId(ledgerId, monthKeyOf(dateObj));
  state.dashUnsub = db.collection(COLLECTION).doc(docId).onSnapshot((snap) => {
    const data = snap.data();
    state.dashEntries = (data && data.entries) ? data.entries.slice() : [];
    renderDashboard();
    flashSync();
  }, (err) => {
    console.error("Firestore listen error (dashboard):", err);
  });
}

function assetStructureDocId(ledgerId) {
  return `${ledgerId}_structure`;
}

function listenAssetStructure(ledgerId) {
  if (state.assetStructureUnsub) state.assetStructureUnsub();
  state.assetStructureUnsub = db.collection(ASSET_COLLECTION).doc(assetStructureDocId(ledgerId)).onSnapshot((snap) => {
    const data = snap.data();
    const prevIds = new Set(state.assetCategories.map(c => c.id));
    state.assetCategories = (data && data.categories) || [];
    state.assetItems = (data && data.items) || [];
    // 처음 보는(=새로 생긴) 분류만 기본적으로 펼쳐서 보여준다. 이미 있던 분류는
    // 사용자가 접거나 펼친 상태를 그대로 유지한다 (첫 로드 때는 전부 "새로 생긴" 것으로
    // 취급되어 모든 분류가 펼쳐진 상태로 시작한다).
    let needsIconBackfill = false;
    state.assetCategories.forEach(cat => {
      if (!prevIds.has(cat.id)) state.assetExpandedCats.add(cat.id);
      // 아이콘이 없는 기존 분류는 이름이 같은 투자 카테고리의 아이콘을 자동으로 붙여준다.
      if (!cat.icon) { cat.icon = iconForAssetCategoryLabel(cat.label); needsIconBackfill = true; }
    });
    if (needsIconBackfill) {
      saveAssetStructure().catch(err => console.error("자산 분류 아이콘 자동 설정 실패:", err));
    }
    renderAssetsScreen();
  }, (err) => {
    console.error("Firestore listen error (asset structure):", err);
  });
}

function listenAssetMonthValues(ledgerId, dateObj) {
  if (state.assetValuesUnsub) state.assetValuesUnsub();
  const docId = monthDocId(ledgerId, monthKeyOf(dateObj));
  state.assetValuesUnsub = db.collection(ASSET_COLLECTION).doc(docId).onSnapshot((snap) => {
    const data = snap.data();
    state.assetMonthValues = (data && data.values) || {};
    renderAssetsScreen();
    flashSync();
  }, (err) => {
    console.error("Firestore listen error (asset values):", err);
  });
}

async function saveAssetStructure() {
  await db.collection(ASSET_COLLECTION).doc(assetStructureDocId(ASSET_LEDGER_KEY)).set({
    categories: state.assetCategories,
    items: state.assetItems,
  });
}

async function saveAssetValue(ledgerId, monthKey, itemId, value) {
  const docId = monthDocId(ledgerId, monthKey);
  await db.collection(ASSET_COLLECTION).doc(docId).set({ values: { [itemId]: value } }, { merge: true });
}

function flashSync() {
  const badge = document.getElementById("syncBadge");
  badge.classList.add("show");
  clearTimeout(flashSync._t);
  flashSync._t = setTimeout(() => badge.classList.remove("show"), 900);
}

async function saveEntry(entry, targetLedgerId) {
  const docId = monthDocId(targetLedgerId, entry.date.slice(0, 7));
  await db.collection(COLLECTION).doc(docId).set({
    entries: firebase.firestore.FieldValue.arrayUnion(entry)
  }, { merge: true });
}

async function deleteEntry(entry, ledgerId) {
  const docId = monthDocId(ledgerId, entry.date.slice(0, 7));
  await db.collection(COLLECTION).doc(docId).update({
    entries: firebase.firestore.FieldValue.arrayRemove(entry)
  });
}

  if (id !== "shared") state.chartMetric = "expense";

/* ====================== 달력 화면 ====================== */
function ymd(d) {
  const y = d.getFullYear(), m = String(d.getMonth() + 1).padStart(2, "0"), day = String(d.getDate()).padStart(2, "0");
  return `${y}-${m}-${day}`;
}
function fmtNum(n) { return Number(n).toLocaleString("ko-KR"); }
function weekdayClass(dow) {
  return dow === 0 ? "wd-sun" : dow === 6 ? "wd-sat" : "";
}
function dayWithWeekday(dateStr) {
  const [y, m, d] = (dateStr || "").split("-").map(Number);
  if (!y || !m || !d) return "";
  const dow = new Date(y, m - 1, d).getDay();
  const wd = ["일", "월", "화", "수", "목", "금", "토"][dow];
  return `<span class="${weekdayClass(dow)}">${d}(${wd})</span>`;
}
function escapeHtml(str) {
  return String(str).replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
}

function renderCalendar() {
  const d = state.calDate;
  const year = d.getFullYear(), month = d.getMonth();
  document.getElementById("monthLabel").textContent = `${year}년 ${month + 1}월`;

  const firstDay = new Date(year, month, 1).getDay();
  const daysInMonth = new Date(year, month + 1, 0).getDate();
  const todayStr = ymd(new Date());

  const entriesByDate = {};
  state.calEntries.forEach(e => {
    if (e.type === "asset") return; // 자산 내역은 별도 화면에서 관리하므로 달력에는 표시하지 않는다.
    (entriesByDate[e.date] = entriesByDate[e.date] || []).push(e);
  });

  let html = "";
  for (let i = 0; i < firstDay; i++) html += `<div class="day-cell empty"></div>`;

  for (let day = 1; day <= daysInMonth; day++) {
    const dateStr = `${year}-${String(month + 1).padStart(2, "0")}-${String(day).padStart(2, "0")}`;
    const dayEntries = entriesByDate[dateStr] || [];
    const isToday = dateStr === todayStr;
    const isSelected = dateStr === state.selectedDate;

    let expenseTotal = 0, incomeTotal = 0, investmentTotal = 0;
    dayEntries.forEach(e => {
      if (e.type === "income") incomeTotal += Number(e.amount);
      else if (e.type === "investment") investmentTotal += Number(e.amount);
      else expenseTotal += Number(e.amount);
    });

    const dayParts = [];
    if (expenseTotal > 0) dayParts.push({ cls: "expense", text: `-${fmtNum(expenseTotal)}` });
    if (incomeTotal > 0) dayParts.push({ cls: "income", text: `+${fmtNum(incomeTotal)}` });
    if (investmentTotal > 0) dayParts.push({ cls: "investment", text: `₩${fmtNum(investmentTotal)}` });

    // 금액 자릿수가 늘어나면 한 줄에 다 들어오도록 폰트 크기를 줄인다.
    const totalLen = dayParts.reduce((sum, p) => sum + p.text.length, 0);
    let entriesFontSize = 9;
    if (totalLen > 20) entriesFontSize = 6;
    else if (totalLen > 16) entriesFontSize = 6.5;
    else if (totalLen > 12) entriesFontSize = 7;
    else if (totalLen > 8) entriesFontSize = 8;

    const linesHtml = dayParts.map(p => `<div class="day-line ${p.cls}">${p.text}</div>`).join("");

    const dow = (firstDay + day - 1) % 7;
    const wdClass = weekdayClass(dow);

    html += `
      <div class="day-cell ${isToday ? "today" : ""} ${isSelected ? "selected" : ""}" data-date="${dateStr}">
        <span class="day-num ${wdClass}">${day}</span>
        <div class="day-entries" style="font-size:${entriesFontSize}px;">${linesHtml}</div>
      </div>`;
  }

  document.getElementById("calendarGrid").innerHTML = html;
  document.querySelectorAll(".day-cell[data-date]").forEach(cell => {
    cell.addEventListener("click", () => selectDate(cell.dataset.date));
  });
}

function selectDate(dateStr) {
  state.selectedDate = dateStr;
  renderCalendar();
  renderDayDetail();
}

function renderDayDetail() {
  const panel = document.getElementById("dayDetail");
  if (!state.selectedDate) {
    panel.style.display = "none";
    return;
  }
  panel.style.display = "block";

  const [y, m, d] = state.selectedDate.split("-");
  const dow = new Date(Number(y), Number(m) - 1, Number(d)).getDay();
  const wd = ["일", "월", "화", "수", "목", "금", "토"][dow];
  document.getElementById("dayDetailTitle").innerHTML =
    `<span class="${weekdayClass(dow)}">${Number(m)}월 ${Number(d)}일 (${wd})</span> 내역`;

  const dayEntries = state.calEntries
    .filter(e => e.date === state.selectedDate && e.type !== "asset")
    .sort((a, b) => (a.createdAt || 0) - (b.createdAt || 0));

  const listEl = document.getElementById("dayDetailList");
  if (dayEntries.length === 0) {
    listEl.innerHTML = `<div class="day-detail-empty">등록된 내역이 없습니다.</div>`;
    return;
  }

  listEl.innerHTML = dayEntries.map(e => {
    const cat = (categoriesForLedger(state.currentLedger)[e.type] || []).find(c => c.id === e.category);
    const icon = cat ? cat.icon : "📦";
    const name = cat ? cat.label : e.category;
    const sign = e.type === "income" ? "+" : "-";
    return `
      <div class="day-detail-row" data-id="${e.id}">
        <span class="icon">${icon}</span>
        <span class="name">${name}${e.memo ? ` <span class="entry-memo-inline">· ${escapeHtml(e.memo)}</span>` : ""}</span>
        <span class="amt ${e.type}">${sign}${fmtNum(e.amount)}원</span>
      </div>`;
  }).join("");

  listEl.querySelectorAll(".day-detail-row").forEach(row => {
    row.addEventListener("click", () => {
      const entry = dayEntries.find(e => e.id === row.dataset.id);
      if (entry) openEditModal(entry, state.currentLedger);
    });
  });
}

function renderMonthSummary() {
  let income = 0, expense = 0, investment = 0;
  state.calEntries.forEach(e => {
    if (e.type === "asset") return; // 자산 내역은 별도 화면에서 관리
    if (e.type === "income") income += Number(e.amount);
    else if (e.type === "investment") investment += Number(e.amount);
    else expense += Number(e.amount);
  });
  const isShared = state.currentLedger === "shared";
  if (!isShared) income = PERSONAL_ALLOWANCE; // 지현/현제는 수입 대신 고정 용돈을 표시
  const expenseText = `${fmtNum(expense)}원`;
  const incomeText = `${fmtNum(income)}원`;
  const investmentText = `${fmtNum(investment)}원`;

  document.getElementById("summaryRemaining").textContent = `${fmtNum(income - expense)}원`;
  document.getElementById("summaryIncome").textContent = incomeText;
  document.getElementById("summaryExpense").textContent = expenseText;
  document.getElementById("summaryInvestment").textContent = investmentText;
  document.getElementById("summaryInvestItem").style.display = isShared ? "flex" : "none";

  // 금액 자릿수가 늘어나도 지출/수입/투자가 한 줄에 다 들어오도록 폰트 크기를 줄인다.
  let summaryLen = expenseText.length + incomeText.length;
  if (isShared) summaryLen += investmentText.length;
  let summaryFontSize = 15;

}

/* ====================== 가로 막대 차트 ====================== */
function segmentLightness(index, count) {
  const maxL = 86, minL = 52;
  const t = count <= 1 ? 0 : index / (count - 1);
  return maxL - t * (maxL - minL);
}

function segmentShade(type, index, count) {
  const hue = type === "expense" ? 340 : type === "investment" ? 265 : 150;
  return `hsl(${hue} 55% ${segmentLightness(index, count)}%)`;
}

function polarPoint(cx, cy, r, angleDeg) {
  const rad = ((angleDeg - 90) * Math.PI) / 180;
  return { x: cx + r * Math.cos(rad), y: cy + r * Math.sin(rad) };
}

function donutSegmentPath(cx, cy, rOuter, rInner, startAngle, endAngle) {
  const so = polarPoint(cx, cy, rOuter, startAngle);
  const eo = polarPoint(cx, cy, rOuter, endAngle);
  const si = polarPoint(cx, cy, rInner, endAngle);
  const ei = polarPoint(cx, cy, rInner, startAngle);
  const largeArc = endAngle - startAngle > 180 ? 1 : 0;
  return `M ${so.x.toFixed(2)} ${so.y.toFixed(2)} A ${rOuter} ${rOuter} 0 ${largeArc} 1 ${eo.x.toFixed(2)} ${eo.y.toFixed(2)} L ${si.x.toFixed(2)} ${si.y.toFixed(2)} A ${rInner} ${rInner} 0 ${largeArc} 0 ${ei.x.toFixed(2)} ${ei.y.toFixed(2)} Z`;
}

function renderDonutChart(svg, calloutsEl, catsWithAmount, totals, denom, type, remainingShare) {
  const CX = 100, CY = 100, R_OUT = 72, R_IN = 38, LINE_R = 90, LINE_END_R = 80;
  const hasRemaining = remainingShare > 0.001;

  if (catsWithAmount.length === 0 && hasRemaining) {
    // 지출 없이 수입만 있는 달: 원 전체가 "남은 돈"
    const pctPoint = polarPoint(CX, CY, (R_OUT + R_IN) / 2, 0);
    svg.innerHTML = `
      <circle cx="${CX}" cy="${CY}" r="${R_OUT}" fill="var(--income-soft)" />
      <circle cx="${CX}" cy="${CY}" r="${R_IN}" fill="var(--card)" />
      <text x="${pctPoint.x.toFixed(2)}" y="${pctPoint.y.toFixed(2)}" font-size="10" font-weight="600" fill="var(--text)" text-anchor="middle" dominant-baseline="central">100%</text>`;
    calloutsEl.innerHTML = "";
    return;
  }

  if (catsWithAmount.length === 1 && !hasRemaining) {
    const c = catsWithAmount[0];
    const tip = polarPoint(CX, CY, LINE_R, 0);
    const lineEnd = polarPoint(CX, CY, LINE_END_R, 0);
    const pctPoint = polarPoint(CX, CY, (R_OUT + R_IN) / 2, 0);
    const textColor = segmentLightness(0, 1) > 68 ? "var(--text)" : "#FFFFFF";
    svg.innerHTML = `
      <circle cx="${CX}" cy="${CY}" r="${R_OUT}" fill="${segmentShade(type, 0, 1)}" />
      <circle cx="${CX}" cy="${CY}" r="${R_IN}" fill="var(--card)" />
      <text x="${pctPoint.x.toFixed(2)}" y="${pctPoint.y.toFixed(2)}" font-size="10" font-weight="600" fill="${textColor}" text-anchor="middle" dominant-baseline="central">100%</text>
      <line x1="${CX}" y1="${CY - R_OUT}" x2="${lineEnd.x.toFixed(2)}" y2="${lineEnd.y.toFixed(2)}" stroke="#000000" stroke-width="0.75" />`;
    calloutsEl.innerHTML = `
      <div class="donut-callout" style="left:${(tip.x / 2).toFixed(1)}%; top:${(tip.y / 2).toFixed(1)}%; transform:translate(-50%,-100%);">
        <span class="icon">${c.icon}</span>
      </div>`;
    return;
  }

  const threshold = catsWithAmount.length <= 5 ? 0 : 0.05;

  let angle = 0;
  let segParts = "";
  const calloutItems = []; // { mid, icon } — 각도 오름차순으로 쌓인다
  const pctCandidates = []; // { x, y, text, color, sweep, share } — 실측 후 겹치거나 넘치면 걸러낸다

  catsWithAmount.forEach((c, i) => {
    const share = totals[c.id] / denom;
    const sweep = share * 360;
    const start = angle;
    const end = angle + sweep;
    const mid = start + sweep / 2;
    angle = end;

    segParts += `<path d="${donutSegmentPath(CX, CY, R_OUT, R_IN, start, end)}" fill="${segmentShade(type, i, catsWithAmount.length)}" />`;

    const pctPoint = polarPoint(CX, CY, (R_OUT + R_IN) / 2, mid);
    const textColor = segmentLightness(i, catsWithAmount.length) > 68 ? "var(--text)" : "#FFFFFF";
    pctCandidates.push({ x: pctPoint.x, y: pctPoint.y, text: `${Math.round(share * 100)}%`, color: textColor, sweep, share });

    if (share > threshold) calloutItems.push({ trueMid: mid, mid, icon: c.icon });
  });

  if (hasRemaining) {
    const sweep = remainingShare * 360;
    segParts += `<path d="${donutSegmentPath(CX, CY, R_OUT, R_IN, angle, angle + sweep)}" fill="var(--income-soft)" />`;
    const pctPoint = polarPoint(CX, CY, (R_OUT + R_IN) / 2, angle + sweep / 2);
    pctCandidates.push({ x: pctPoint.x, y: pctPoint.y, text: `${Math.round(remainingShare * 100)}%`, color: "var(--text)", sweep, share: remainingShare });
    angle += sweep;
  }

  // 각도가 가까운 아이콘끼리는 (1) 라벨 각도를 옆으로 밀어 벌리고,
  // (2) 그래도 남는 밀집은 연결선 길이를 번갈아 늘려 지그재그로 벌린다.
  // 연결선은 실제 조각 위치(edge)에서 시작해 옆으로 밀린 라벨 위치(tip)까지
  // 이어지므로, 밀집 구간에서는 선이 비스듬히 꺾여 보인다.
  const MIN_GAP_DEG = 18;
  const MAX_SHIFT_DEG = 26; // 원래 각도에서 너무 멀리 밀리지 않도록 제한
  const R_TIERS = [LINE_R, LINE_R + 14]; // 90, 104

  for (let pass = 0; pass < calloutItems.length; pass++) {
    let moved = false;
    for (let i = 1; i < calloutItems.length; i++) {
      const gap = calloutItems[i].mid - calloutItems[i - 1].mid;
      if (gap < MIN_GAP_DEG) {
        const shift = (MIN_GAP_DEG - gap) / 2;
        calloutItems[i - 1].mid -= shift;
        calloutItems[i].mid += shift;
        moved = true;
      }
    }
    if (!moved) break;
  }
  calloutItems.forEach(item => {
    const delta = Math.max(-MAX_SHIFT_DEG, Math.min(MAX_SHIFT_DEG, item.mid - item.trueMid));
    item.mid = item.trueMid + delta;
  });
  if (calloutItems.length > 1) {
    const first = calloutItems[0];
    const last = calloutItems[calloutItems.length - 1];
    const wrapGap = (360 - last.mid) + first.mid;
    if (wrapGap < MIN_GAP_DEG) {
      const shift = Math.min(MAX_SHIFT_DEG, (MIN_GAP_DEG - wrapGap) / 2);
      first.mid = Math.min(first.trueMid + MAX_SHIFT_DEG, first.mid + shift);
      last.mid = Math.max(last.trueMid - MAX_SHIFT_DEG, last.mid - shift);
    }
  }

  calloutItems.forEach((item, i) => {
    const gap = i === 0 ? Infinity : item.mid - calloutItems[i - 1].mid;
    const prevLevel = i === 0 ? 0 : calloutItems[i - 1].level;
    item.level = gap < MIN_GAP_DEG ? (prevLevel + 1) % 2 : 0;
  });

  let lineParts = "";
  let callouts = "";
  calloutItems.forEach(item => {
    const r = R_TIERS[item.level];
    const gap = 10; // 아이콘과 겹치지 않도록 살짝 못 미쳐서 멈춤
    const edge = polarPoint(CX, CY, R_OUT, item.trueMid); // 실제 조각 위치에서 선 시작
    const tip = polarPoint(CX, CY, r, item.mid);           // 라벨은 옆으로 밀린 각도에 배치
    const lineEnd = polarPoint(CX, CY, r - gap, item.mid);

    lineParts += `<line x1="${edge.x.toFixed(2)}" y1="${edge.y.toFixed(2)}" x2="${lineEnd.x.toFixed(2)}" y2="${lineEnd.y.toFixed(2)}" stroke="#000000" stroke-width="0.75" />`;

    const left = (tip.x / 2).toFixed(1);
    const top = (tip.y / 2).toFixed(1);
    callouts += `
      <div class="donut-callout" style="left:${left}%; top:${top}%; transform:translate(-50%,-50%);">
        <span class="icon">${item.icon}</span>
      </div>`;
  });

  svg.innerHTML = segParts + lineParts;
  calloutsEl.innerHTML = callouts;
  renderFittingPercentLabels(svg, pctCandidates, R_OUT, R_IN);
}

// 세그먼트를 실제로 그린 뒤 % 라벨을 하나씩 추가해보고 실측한다.
// 자기 조각 폭을 벗어나거나 이미 표시된 라벨과 겹치면 아예 표시하지 않는다.
// (큰 조각부터 먼저 배치해서, 자리가 부족하면 작은 조각 라벨이 양보한다.)
function renderFittingPercentLabels(svg, candidates, R_OUT, R_IN) {
  const radiusMid = (R_OUT + R_IN) / 2;
  const ringHeight = R_OUT - R_IN;
  const svgNS = "http://www.w3.org/2000/svg";

  // 다른 탭을 보고 있는 등 실제로 화면에 그려지지 않은 상태에서는 getBBox 실측이
  // 부정확하거나 예외를 던질 수 있으므로, 이때는 각도 기준의 단순 규칙으로 대체한다.
  // (해당 탭으로 돌아오면 renderDashboard()가 다시 호출되어 정확히 재측정된다.)
  const isVisible = svg.getClientRects().length > 0;

  const accepted = [];
  candidates.slice().sort((a, b) => b.share - a.share).forEach(cand => {
    if (!isVisible) {
      if (cand.sweep >= 10) {
        const fallbackEl = document.createElementNS(svgNS, "text");
        fallbackEl.setAttribute("x", cand.x.toFixed(2));
        fallbackEl.setAttribute("y", cand.y.toFixed(2));
        fallbackEl.setAttribute("font-size", "10");
        fallbackEl.setAttribute("font-weight", "600");
        fallbackEl.setAttribute("fill", cand.color);
        fallbackEl.setAttribute("text-anchor", "middle");
        fallbackEl.setAttribute("dominant-baseline", "central");
        fallbackEl.textContent = cand.text;
        svg.appendChild(fallbackEl);
      }
      return;
    }

    const chordWidth = 2 * radiusMid * Math.sin((cand.sweep * Math.PI / 180) / 2);

    const textEl = document.createElementNS(svgNS, "text");
    textEl.setAttribute("x", cand.x.toFixed(2));
    textEl.setAttribute("y", cand.y.toFixed(2));
    textEl.setAttribute("font-size", "10");
    textEl.setAttribute("font-weight", "600");
    textEl.setAttribute("fill", cand.color);
    textEl.setAttribute("text-anchor", "middle");
    textEl.setAttribute("dominant-baseline", "central");
    textEl.textContent = cand.text;
    svg.appendChild(textEl);

    let bbox = null;
    try { bbox = textEl.getBBox(); } catch (err) { /* 측정 실패 시 표시하지 않음 */ }

    const fits = !!bbox && bbox.width <= chordWidth * 0.94 && bbox.height <= ringHeight * 0.92;
    const overlaps = !!bbox && accepted.some(r =>
      bbox.x < r.x + r.width && bbox.x + bbox.width > r.x &&
      bbox.y < r.y + r.height && bbox.y + bbox.height > r.y
    );

    if (!fits || overlaps) {
      svg.removeChild(textEl);
    } else {
      accepted.push(bbox);
    }
  });
}

function renderDashboard() {
  renderPayerFilter();
  updateDashTypeVisibility();

  const d = state.dashDate;
  const month = d.getMonth();
  document.getElementById("donutCenterLabel").textContent = `${month + 1}월`;

  const applyPayerFilter = (entries) => {
    if (state.currentLedger === "shared" && !state.dashPayerFilter.has("all")) {
      return entries.filter(e => state.dashPayerFilter.has(e.payer));
    }
    return entries;
  };

  const filtered = applyPayerFilter(state.dashEntries.filter(e => e.type === state.dashType));
  const totalAmount = filtered.reduce((sum, e) => sum + Number(e.amount), 0);
  document.getElementById("dashTotal").textContent = `${fmtNum(totalAmount)}원`;

  // 지출 대시보드에서는 도넛의 100%가 "전체 수입"이 되도록, 남은 돈(수입-지출)을 별도 조각으로 채운다.
  // 지현/현제는 수입 내역이 없으므로 고정 용돈(50만원)을 기준으로 삼는다.
  const isShared = state.currentLedger === "shared";
  let remainingShare = 0;
  let donutDenom = totalAmount;
  let overspendWarning = false;
  if (state.dashType === "expense") {
    const baselineIncome = isShared
      ? applyPayerFilter(state.dashEntries.filter(e => e.type === "income")).reduce((sum, e) => sum + Number(e.amount), 0)
      : PERSONAL_ALLOWANCE;
    donutDenom = Math.max(baselineIncome, totalAmount);
    if (donutDenom > 0) {
      remainingShare = Math.max(0, baselineIncome - totalAmount) / donutDenom;
    }
    if (!isShared && totalAmount > OVERSPEND_WARNING_THRESHOLD) overspendWarning = true;
  }
  document.getElementById("dashWarning").style.display = overspendWarning ? "block" : "none";

  const cats = categoriesForLedger(state.currentLedger)[state.dashType] || [];
  const totals = {};
  const entriesByCat = {};
  cats.forEach(c => { totals[c.id] = 0; entriesByCat[c.id] = []; });
  filtered.forEach(e => {
    totals[e.category] = (totals[e.category] || 0) + Number(e.amount);
    if (entriesByCat[e.category]) entriesByCat[e.category].push(e);
  });

  const catsWithAmount = cats.filter(c => totals[c.id] > 0).sort((a, b) => totals[b.id] - totals[a.id]);

  const chartEl = document.getElementById("dashChart");
  const calloutsEl = document.getElementById("donutCallouts");
  const emptyMsg = document.getElementById("dashEmpty");

  if (catsWithAmount.length === 0 && remainingShare <= 0.001) {
    emptyMsg.style.display = "block";
    chartEl.innerHTML = "";
    calloutsEl.innerHTML = "";
  } else {
    emptyMsg.style.display = "none";
    renderDonutChart(chartEl, calloutsEl, catsWithAmount, totals, donutDenom, state.dashType, remainingShare);
  }

  const sign = state.dashType === "income" ? "+" : "-";

  document.getElementById("catList").innerHTML = catsWithAmount.map(c => {
    const expanded = state.dashExpandedCats.has(c.id);
    const entries = entriesByCat[c.id].slice().sort((a, b) => (b.date || "").localeCompare(a.date || "") || (b.createdAt || 0) - (a.createdAt || 0));

    const entriesHtml = entries.map(e => {
      const dateLabel = dayWithWeekday(e.date);
      const memoHtml = e.memo ? escapeHtml(e.memo) : "";
      return `
        <div class="cat-entry-row" data-id="${e.id}">
          <span class="search-date mono">${dateLabel}</span>
          <span class="entry-memo">${memoHtml}</span>
          <span class="amt ${e.type}">${sign}${fmtNum(e.amount)}원</span>
        </div>`;
    }).join("");

    return `
    <div class="cat-row-wrap">
      <button class="cat-row" data-cat="${c.id}">
        <span class="icon">${c.icon}</span>
        <span class="name">${c.label}</span>
        <span class="amt ${state.dashType}">${sign}${fmtNum(totals[c.id])}원</span>
        <span class="chevron">${expanded ? "▲" : "▼"}</span>
      </button>
      ${expanded ? `<div class="cat-entries">${entriesHtml}</div>` : ""}
    </div>`;
  }).join("");

  document.querySelectorAll(".cat-row").forEach(btn => {
    btn.addEventListener("click", () => {
      const id = btn.dataset.cat;
      if (state.dashExpandedCats.has(id)) state.dashExpandedCats.delete(id);
      else state.dashExpandedCats.add(id);
      renderDashboard();
    });
  });

  document.querySelectorAll(".cat-entry-row").forEach(row => {
    row.addEventListener("click", () => {
      const entry = state.dashEntries.find(e => e.id === row.dataset.id);
      if (entry) openEditModal(entry, state.currentLedger);
    });
  });
}

/* ====================== 자산 입력 / 차트 화면 ======================
   달력/대시보드와 달리 특정 월이 아니라 현재 가계부의 전체 월별 문서를
   한 번에 불러온다 (실시간 구독 아님). 지출/수입/투자는 그 달의 가계부
   내역에서 자동 집계하고, "자산"(잔고)은 사용자가 엑셀처럼 직접 입력한
   값을 그대로 사용한다 (entries와 별개인 asset 필드).
============================================================ */
function monthLabelOf(monthKey) {
  const [y, m] = monthKey.split("-").map(Number);
  return `${y}년 ${m}월`;
}

function addMonths(monthKey, delta) {
  let [y, m] = monthKey.split("-").map(Number);
  m += delta;
  while (m > 12) { m -= 12; y++; }
  while (m < 1) { m += 12; y--; }
  return `${y}-${String(m).padStart(2, "0")}`;
}

function buildMonthRange(startKey, endKey) {
  const result = [];
  let cur = startKey;
  while (cur <= endKey) {
    result.push(cur);
    cur = addMonths(cur, 1);
  }
  return result;
}

// 시작/종료 연-월 셀렉트를 실제 데이터 범위(+오늘)로 채우고, 값이 없거나
// 더 이상 유효하지 않으면 기본값(시작=가장 이른 달, 종료=오늘)으로 되돌린다.
function populateMonthSelectors(startElId, endElId, startStateKey, endStateKey) {
  const todayKey = monthKeyOf(new Date());
  const dataKeys = state.assetsMonths.map(m => m.monthKey);
  const allKeys = dataKeys.concat([todayKey]);
  const minKey = allKeys.reduce((a, b) => (a < b ? a : b));
  const maxKey = allKeys.reduce((a, b) => (a > b ? a : b));
  const options = buildMonthRange(minKey, maxKey);

  if (!state[startStateKey] || !options.includes(state[startStateKey])) state[startStateKey] = minKey;
  if (!state[endStateKey] || !options.includes(state[endStateKey])) state[endStateKey] = todayKey;

  const optionsHtml = options.map(k => `<option value="${k}">${monthLabelOf(k)}</option>`).join("");
  const startSel = document.getElementById(startElId);
  const endSel = document.getElementById(endElId);
  startSel.innerHTML = optionsHtml;
  endSel.innerHTML = optionsHtml;
  startSel.value = state[startStateKey];
  endSel.value = state[endStateKey];
}

// 차트 화면 전용: 현재 가계부의 전체 월별 문서를 한 번에 불러와 집계한다.
async function loadAssetMonthlyData() {
  const prefix = `${state.currentLedger}_`;
  const byMonth = {};
  try {
    const snap = await db.collection(COLLECTION)
      .where(firebase.firestore.FieldPath.documentId(), ">=", prefix)
      .where(firebase.firestore.FieldPath.documentId(), "<", prefix + "")
      .get();

    snap.forEach(doc => {
      const monthKey = doc.id.slice(prefix.length);
      const entries = (doc.data() && doc.data().entries) || [];
      let expense = 0, income = 0, investment = 0;
      const expenseByCat = {}, incomeByCat = {}, investmentByCat = {};
      entries.forEach(e => {
        const amt = Number(e.amount);
        if (e.type === "income") { income += amt; incomeByCat[e.category] = (incomeByCat[e.category] || 0) + amt; }
        else if (e.type === "investment") { investment += amt; investmentByCat[e.category] = (investmentByCat[e.category] || 0) + amt; }
        else { expense += amt; expenseByCat[e.category] = (expenseByCat[e.category] || 0) + amt; }
      });
      byMonth[monthKey] = { monthKey, expense, income, investment, asset: null, expenseByCat, incomeByCat, investmentByCat, itemValues: {} };
    });
  } catch (err) {
    console.error("가계부 데이터 로드 실패:", err);
  }

  // 자산(자산 잔액)은 가계부 토글과 무관하게 공통 자산(ASSET_LEDGER_KEY)의 월별 세부항목
  // 금액에서 가져온다. "{ledgerId}_structure" 문서는 월 데이터가 아니므로 걸러낸다.
  const assetPrefix = `${ASSET_LEDGER_KEY}_`;
  try {
    const snap = await db.collection(ASSET_COLLECTION)
      .where(firebase.firestore.FieldPath.documentId(), ">=", assetPrefix)
      .where(firebase.firestore.FieldPath.documentId(), "<", assetPrefix + "")
      .get();

    snap.forEach(doc => {
      const monthKey = doc.id.slice(assetPrefix.length);
      if (!/^\d{4}-\d{2}$/.test(monthKey)) return; // structure 문서 제외
      const values = (doc.data() && doc.data().values) || {};
      const amounts = Object.values(values).filter(v => v != null);
      if (!byMonth[monthKey]) byMonth[monthKey] = { monthKey, expense: 0, income: 0, investment: 0, asset: null, expenseByCat: {}, incomeByCat: {}, investmentByCat: {}, itemValues: {} };
      byMonth[monthKey].itemValues = values; // 그 달에 실제 입력된 항목별 값 (없는 항목은 renderChart에서 carry-forward)
      if (amounts.length === 0) return; // 값을 하나도 입력하지 않은 달은 asset을 null로 두어 이전 값을 이어간다(carry-forward)
      byMonth[monthKey].asset = amounts.reduce((sum, v) => sum + Number(v), 0);
    });
  } catch (err) {
    console.error("자산 데이터 로드 실패:", err);
  }

  state.assetsMonths = Object.values(byMonth).sort((a, b) => a.monthKey.localeCompare(b.monthKey));
  populateMonthSelectors("chartStartSelect", "chartEndSelect", "chartStartMonth", "chartEndMonth");
  renderChart();
}

/* ---------- 자산 화면 (월별 자산 내역 목록) ---------- */
// 분류(카테고리)는 토글로 접고 펼치고, 세부항목은 그 안에 들여쓴 행으로 표시한다.
// 각 세부항목의 금액 칸은 클릭하면 입력창으로 바뀌는 엑셀 스타일 셀이다.
function renderAssetsScreen() {
  const d = state.assetsDate;
  document.getElementById("assetsMonthLabel").textContent = `${d.getFullYear()}년 ${d.getMonth() + 1}월`;

  let total = 0;
  Object.values(state.assetMonthValues).forEach(v => { total += Number(v) || 0; });
  document.getElementById("assetsMonthTotal").textContent = `${fmtNum(total)}원`;

  const listEl = document.getElementById("assetsEntryList");
  if (state.assetCategories.length === 0) {
    listEl.innerHTML = `<div class="day-detail-empty">등록된 자산 분류가 없습니다. + 버튼으로 추가해보세요.</div>`;
    return;
  }

  const filter = state.assetOwnerFilter;
  const filteredItems = filter === "all"
    ? state.assetItems
    : state.assetItems.filter(it => (it.ownerLedger || "shared") === filter);

  const itemsByCat = {};
  filteredItems.forEach(it => { (itemsByCat[it.categoryId] = itemsByCat[it.categoryId] || []).push(it); });

  // 필터가 "전체"가 아닐 때는, 그 가계부로 등록된 항목이 하나도 없는 분류는 목록에서 숨긴다.
  const visibleCategories = filter === "all"
    ? state.assetCategories
    : state.assetCategories.filter(cat => (itemsByCat[cat.id] || []).length > 0);

  if (visibleCategories.length === 0) {
    listEl.innerHTML = `<div class="day-detail-empty">해당 가계부로 등록된 자산 항목이 없습니다.</div>`;
    return;
  }

  listEl.innerHTML = visibleCategories.map(cat => {
    const items = itemsByCat[cat.id] || [];
    const catTotal = items.reduce((sum, it) => sum + (Number(state.assetMonthValues[it.id]) || 0), 0);
    const expanded = state.assetExpandedCats.has(cat.id);

    const itemsHtml = items.map(it => {
      const val = state.assetMonthValues[it.id];
      const displayText = val != null ? fmtNum(val) : "-";
      const owner = it.ownerLedger || "shared";
      return `
        <div class="cat-entry-row">
          <span class="owner-tag owner-${owner}">${LEDGER_SHORT_LABEL[owner]}</span>
          <span class="entry-memo">${escapeHtml(it.label)}</span>
          <span class="value-cell" data-item="${it.id}">
            <span class="cell-display mono">${displayText}</span>
            <input type="text" inputmode="numeric" class="cell-input mono" data-item="${it.id}" value="${val != null ? fmtNum(val) : ""}" style="display:none;" autocomplete="off" />
          </span>
        </div>`;
    }).join("");

    return `
      <div class="cat-row-wrap">
        <button class="cat-row" data-cat="${cat.id}">
          <span class="icon">${cat.icon || DEFAULT_ASSET_ICON}</span>
          <span class="name">${escapeHtml(cat.label)}</span>
          <span class="amt income">${fmtNum(catTotal)}원</span>
          <span class="chevron">${expanded ? "▲" : "▼"}</span>
        </button>
        ${expanded ? `<div class="cat-entries">${itemsHtml}</div>` : ""}
      </div>`;
  }).join("");

  listEl.querySelectorAll(".cat-row[data-cat]").forEach(btn => {
    btn.addEventListener("click", () => {
      const id = btn.dataset.cat;
      if (state.assetExpandedCats.has(id)) state.assetExpandedCats.delete(id);
      else state.assetExpandedCats.add(id);
      renderAssetsScreen();
    });
  });

  listEl.querySelectorAll(".cell-display").forEach(span => {
    span.addEventListener("click", () => {
      const cell = span.closest(".value-cell");
      const input = cell.querySelector(".cell-input");
      span.style.display = "none";
      input.style.display = "inline-block";
      input.focus();
      input.select();
    });
  });

  listEl.querySelectorAll(".cell-input").forEach(input => {
    input.addEventListener("input", () => {
      const digits = input.value.replace(/[^0-9]/g, "");
      input.value = digits ? Number(digits).toLocaleString("ko-KR") : "";
    });
    input.addEventListener("blur", async () => {
      const itemId = input.dataset.item;
      const digits = input.value.replace(/[^0-9]/g, "");
      const value = digits ? Number(digits) : null;
      const prev = state.assetMonthValues[itemId] != null ? state.assetMonthValues[itemId] : null;
      if (prev === value) {
        input.style.display = "none";
        input.previousElementSibling.style.display = "inline";
        return;
      }
      state.assetMonthValues[itemId] = value;
      renderAssetsScreen();
      try {
        await saveAssetValue(ASSET_LEDGER_KEY, monthKeyOf(state.assetsDate), itemId, value);
        flashSync();
      } catch (err) {
        console.error("자산 값 저장 실패:", err);
        alert("저장에 실패했습니다.\n" + err.message);
      }
    });
  });
}

// assetManageDraft.kind: null(입력창 없음) | "category"(분류 추가 입력창) | "item"(특정 분류의 항목 추가 입력창)

          <span class="manage-name-wrap" data-rename-cat="${cat.id}">

async function confirmAssetManageDraft() {
  const draft = state.assetManageDraft;
  const text = (draft.text || "").trim();
  if (!text) return;

  if (draft.kind === "category") {
    const id = crypto.randomUUID ? crypto.randomUUID() : String(Date.now());
    state.assetCategories.push({ id, label: text, icon: draft.icon || DEFAULT_ASSET_ICON });
  } else {
    const id = crypto.randomUUID ? crypto.randomUUID() : String(Date.now()) + Math.random().toString(16).slice(2);
    state.assetItems.push({ id, categoryId: draft.categoryId, label: text, ownerLedger: draft.ownerLedger || "shared" });
    state.assetExpandedCats.add(draft.categoryId); // 추가한 분류는 자산 화면에서 바로 펼쳐서 보여준다
  }
  state.assetManageDraft = { kind: null, categoryId: null, text: "", ownerLedger: "shared", icon: DEFAULT_ASSET_ICON };

  try {
    await saveAssetStructure();
  } catch (err) {
    console.error("자산 항목 저장 실패:", err);
    alert("저장에 실패했습니다.\n" + err.message);
  }
  renderAssetManageList();
  renderAssetsScreen();
}

async function deleteAssetCategory(categoryId) {
  const cat = state.assetCategories.find(c => c.id === categoryId);
  const itemCount = state.assetItems.filter(it => it.categoryId === categoryId).length;
  const msg = itemCount > 0
    ? `"${cat ? cat.label : ""}" 분류와 그 안의 항목 ${itemCount}개를 모두 삭제할까요?`
    : `"${cat ? cat.label : ""}" 분류를 삭제할까요?`;
  if (!confirm(msg)) return;

  state.assetCategories = state.assetCategories.filter(c => c.id !== categoryId);
  state.assetItems = state.assetItems.filter(it => it.categoryId !== categoryId);
  state.assetExpandedCats.delete(categoryId);

  try {
    await saveAssetStructure();
  } catch (err) {
    console.error("삭제 실패:", err);
    alert("삭제에 실패했습니다.\n" + err.message);
  }
  renderAssetManageList();
  renderAssetsScreen();
}

async function deleteAssetItem(itemId) {
  const it = state.assetItems.find(i => i.id === itemId);
  if (!confirm(`"${it ? it.label : ""}" 항목을 삭제할까요?`)) return;

  state.assetItems = state.assetItems.filter(i => i.id !== itemId);

  try {
    await saveAssetStructure();
  } catch (err) {
    console.error("삭제 실패:", err);
    alert("삭제에 실패했습니다.\n" + err.message);
  }
  renderAssetManageList();
  renderAssetsScreen();
}

async function updateAssetItemOwner(itemId, ownerLedger) {
  const item = state.assetItems.find(it => it.id === itemId);
  if (!item) return;
  const prev = item.ownerLedger || "shared";
  if (prev === ownerLedger) return;
  item.ownerLedger = ownerLedger;
  try {
    await saveAssetStructure();
  } catch (err) {
    console.error("자산 항목 소유 가계부 변경 실패:", err);
    alert("저장에 실패했습니다.\n" + err.message);
    item.ownerLedger = prev;
    renderAssetManageList();
    return;
  }
  renderAssetsScreen();
}

async function updateAssetCategoryIcon(categoryId, icon) {
  const cat = state.assetCategories.find(c => c.id === categoryId);
  if (!cat) return;
  const prev = cat.icon || DEFAULT_ASSET_ICON;
  if (prev === icon) return;
  cat.icon = icon;
  try {
    await saveAssetStructure();
  } catch (err) {
    console.error("자산 분류 아이콘 변경 실패:", err);
    alert("저장에 실패했습니다.\n" + err.message);
    cat.icon = prev;
    renderAssetManageList();
    return;
  }
  renderAssetsScreen();
}

// 분류/항목 이름을 클릭하면 그 자리에서 입력창으로 바뀌어 바로 수정할 수 있다.
function startAssetRename(nameWrap, kind, id) {
  const display = nameWrap.querySelector(".manage-name-display");
  const input = nameWrap.querySelector(".manage-name-input");
  if (input.style.display === "block") return; // 이미 편집 중이면 무시
  display.style.display = "none";
  input.style.display = "block";
  input.focus();
  input.select();

  const finish = () => {
    input.removeEventListener("blur", finish);
    input.removeEventListener("keydown", onKeydown);
    commitAssetRename(kind, id, input.value.trim(), display, input);
  };
  const onKeydown = (e) => {
    if (e.key === "Enter") input.blur();
    else if (e.key === "Escape") { input.value = display.textContent; input.blur(); }
  };
  input.addEventListener("blur", finish);
  input.addEventListener("keydown", onKeydown);
}

async function commitAssetRename(kind, id, newLabel, display, input) {
  const list = kind === "cat" ? state.assetCategories : state.assetItems;
  const target = list.find(x => x.id === id);
  const oldLabel = target ? target.label : "";

  if (!newLabel || !target || newLabel === oldLabel) {
    input.style.display = "none";
    display.style.display = "block";
    return;
  }

  target.label = newLabel;
  display.textContent = newLabel;
  input.style.display = "none";
  display.style.display = "block";

  try {
    await saveAssetStructure();
    renderAssetsScreen();
  } catch (err) {

}

// 분류(⠿ 손잡이, #assetManageList의 직계 자식)와 항목(⠿ 손잡이, 각 분류의 .manage-items 안)을
// 포인터로 드래그해서 순서를 바꾼다. 목록이 다시 그려져도(#assetManageList 자체는 그대로라)
// 한 번만 등록해도 계속 동작한다.
function initAssetManageDrag() {
  const root = document.getElementById("assetManageList");
  root.addEventListener("pointerdown", (e) => {
    const handle = e.target.closest(".drag-handle");
    if (!handle) return;
    e.preventDefault();

    const kind = handle.dataset.drag;
    const dragging = kind === "cat" ? handle.closest(".manage-cat-block") : handle.closest(".manage-item-row");
    if (!dragging) return;
    const containerEl = dragging.parentElement;
    const itemSelector = kind === "cat" ? ".manage-cat-block" : ".manage-item-row";

    dragging.classList.add("dragging");
    try { handle.setPointerCapture(e.pointerId); } catch (err) { /* 일부 브라우저에서 실패해도 무시 */ }

    function onMove(ev) {
      const siblings = Array.from(containerEl.children).filter(el => el.matches(itemSelector) && el !== dragging);
      for (const el of siblings) {
        const rect = el.getBoundingClientRect();
        if (ev.clientY >= rect.top && ev.clientY <= rect.bottom) {
          if (ev.clientY < rect.top + rect.height / 2) containerEl.insertBefore(dragging, el);
          else containerEl.insertBefore(dragging, el.nextSibling);
          break;
        }
      }
    }

    function onUp() {
      dragging.classList.remove("dragging");
      window.removeEventListener("pointermove", onMove);
      window.removeEventListener("pointerup", onUp);

      if (kind === "cat") {
        const newOrder = Array.from(root.children)
          .filter(el => el.matches(".manage-cat-block"))
          .map(el => el.dataset.catId);
        state.assetCategories.sort((a, b) => newOrder.indexOf(a.id) - newOrder.indexOf(b.id));
      } else {
        const catId = containerEl.dataset.catItems;
        const newOrderIds = Array.from(containerEl.children)
          .filter(el => el.matches(".manage-item-row"))
          .map(el => el.dataset.itemId);
        const others = state.assetItems.filter(it => it.categoryId !== catId);
        const reordered = newOrderIds.map(id => state.assetItems.find(it => it.id === id)).filter(Boolean);
        state.assetItems = others.concat(reordered);
      }

      saveAssetStructure().catch(err => {
        console.error("순서 저장 실패:", err);
        alert("순서 저장에 실패했습니다.\n" + err.message);
      });
      renderAssetManageList();
      renderAssetsScreen();
    }

    window.addEventListener("pointermove", onMove);
    window.addEventListener("pointerup", onUp);
  });
}
initAssetManageDrag();

// y좌표가 그래프 위쪽 가장자리에 너무 가까우면 값 라벨을 점 아래로 내려서 잘리지 않게 한다.
function valueLabelY(y, plotTop) {
  return (y - plotTop) < 12 ? y + 11 : y - 6;
}

function renderTrendChart(svg, series, metric) {
  const W = 320, H = 180;
  const PAD_L = 8, PAD_R = 8, PAD_TOP = 18, PAD_BOTTOM = 22;
  const plotH = H - PAD_TOP - PAD_BOTTOM;
  const color = metric === "expense" ? "var(--expense)"
    : metric === "income" ? "var(--income)"
    : metric === "investment" ? "var(--invest)"
    : "var(--accent)"; // balance
  const n = series.length;
  const firstLabel = `${Number(series[0].monthKey.split("-")[1])}월`;

  const values = series.map(s => s.value);
  const minV = Math.min(0, ...values);
  const maxV = Math.max(0, ...values);
  const range = (maxV - minV) || 1;
  const yOf = (v) => PAD_TOP + plotH - ((v - minV) / range) * plotH;

  if (n === 1) {
    const y = yOf(series[0].value);
    svg.innerHTML = `
      <circle cx="${(W / 2).toFixed(1)}" cy="${y.toFixed(1)}" r="3" fill="${color}" />
      <text x="${(W / 2).toFixed(1)}" y="${valueLabelY(y, PAD_TOP).toFixed(1)}" font-size="8" font-weight="600" fill="${color}" text-anchor="middle">${fmtNum(series[0].value)}</text>
      <text x="${(W / 2).toFixed(1)}" y="${H - 6}" font-size="10" fill="var(--text-dim)" text-anchor="middle">${firstLabel}</text>`;
    return;
  }

  const stepX = (W - PAD_L - PAD_R) / (n - 1);
  const xOf = (i) => PAD_L + i * stepX;
  const zeroY = yOf(0);
  const lastLabel = `${Number(series[n - 1].monthKey.split("-")[1])}월`;

  const points = series.map((s, i) => `${xOf(i).toFixed(1)},${yOf(s.value).toFixed(1)}`).join(" ");
  const areaPoints = `${xOf(0).toFixed(1)},${zeroY.toFixed(1)} ${points} ${xOf(n - 1).toFixed(1)},${zeroY.toFixed(1)}`;
  const dots = series.map((s, i) => `<circle cx="${xOf(i).toFixed(1)}" cy="${yOf(s.value).toFixed(1)}" r="2.5" fill="${color}" />`).join("");
  const valueLabels = series.map((s, i) => {
    const x = xOf(i), y = yOf(s.value);
    return `<text x="${x.toFixed(1)}" y="${valueLabelY(y, PAD_TOP).toFixed(1)}" font-size="7" font-weight="600" fill="${color}" text-anchor="middle">${fmtNum(s.value)}</text>`;
  }).join("");

  svg.innerHTML = `
    <line x1="${PAD_L}" y1="${zeroY.toFixed(1)}" x2="${W - PAD_R}" y2="${zeroY.toFixed(1)}" stroke="var(--border)" stroke-width="1" />
    <polygon points="${areaPoints}" fill="${color}" opacity="0.12" />
    <polyline points="${points}" fill="none" stroke="${color}" stroke-width="2" stroke-linejoin="round" stroke-linecap="round" />
    ${dots}
    ${valueLabels}
    <text x="${xOf(0).toFixed(1)}" y="${H - 6}" font-size="10" fill="var(--text-dim)" text-anchor="start">${firstLabel}</text>
    <text x="${xOf(n - 1).toFixed(1)}" y="${H - 6}" font-size="10" fill="var(--text-dim)" text-anchor="end">${lastLabel}</text>`;
}

// "전체" 모드: 잔고는 막대로, 지출/수입/투자는 꺾은선으로 겹쳐 그린다.
// 각 지표는 서로 스케일이 크게 달라 자기 자신의 최소/최대값 기준으로 각자 정규화한다.
function renderComboChart(svg, months) {
  const W = 320, H = 180;
  const PAD_L = 8, PAD_R = 8, PAD_TOP = 18, PAD_BOTTOM = 22;
  const plotH = H - PAD_TOP - PAD_BOTTOM;
  const n = months.length;

  const scaleFor = (key) => {
    const vals = months.map(m => m[key]);
    const minV = Math.min(0, ...vals);
    const maxV = Math.max(0, ...vals);
    const range = (maxV - minV) || 1;
    return (v) => PAD_TOP + plotH - ((v - minV) / range) * plotH;
  };
  const balanceY = scaleFor("balance");
  const expenseY = scaleFor("expense");
  const incomeY = scaleFor("income");
  const investmentY = scaleFor("investment");

  const firstLabel = `${Number(months[0].monthKey.split("-")[1])}월`;
  const lastLabel = `${Number(months[n - 1].monthKey.split("-")[1])}월`;

  if (n === 1) {
    const cx = W / 2;
    const barW = 24;
    const zeroY = balanceY(0);
    const valY = balanceY(months[0].balance);
    const top = Math.min(zeroY, valY);
    const h = Math.max(2, Math.abs(zeroY - valY));
    svg.innerHTML = `
      <rect x="${(cx - barW / 2).toFixed(1)}" y="${top.toFixed(1)}" width="${barW}" height="${h.toFixed(1)}" rx="3" fill="var(--accent)" opacity="0.55" />
      <text x="${cx.toFixed(1)}" y="${valueLabelY(top, PAD_TOP).toFixed(1)}" font-size="8" font-weight="600" fill="var(--accent)" text-anchor="middle">${fmtNum(months[0].balance)}</text>
      <circle cx="${cx.toFixed(1)}" cy="${expenseY(months[0].expense).toFixed(1)}" r="2.5" fill="var(--expense)" />
      <circle cx="${cx.toFixed(1)}" cy="${incomeY(months[0].income).toFixed(1)}" r="2.5" fill="var(--income)" />
      <circle cx="${cx.toFixed(1)}" cy="${investmentY(months[0].investment).toFixed(1)}" r="2.5" fill="var(--invest)" />
      <text x="${cx.toFixed(1)}" y="${H - 6}" font-size="10" fill="var(--text-dim)" text-anchor="middle">${firstLabel}</text>`;
    return;
  }

  const stepX = (W - PAD_L - PAD_R) / n;
  const xOfCenter = (i) => PAD_L + stepX * (i + 0.5);
  const barW = Math.min(20, stepX * 0.5);
  const zeroYBal = balanceY(0);

  let bars = "";
  let barLabels = "";
  months.forEach((m, i) => {
    const cx = xOfCenter(i);
    const y = balanceY(m.balance);
    const top = Math.min(zeroYBal, y);
    const h = Math.max(1.5, Math.abs(zeroYBal - y));
    bars += `<rect x="${(cx - barW / 2).toFixed(1)}" y="${top.toFixed(1)}" width="${barW.toFixed(1)}" height="${h.toFixed(1)}" rx="2" fill="var(--accent)" opacity="0.5" />`;
    barLabels += `<text x="${cx.toFixed(1)}" y="${valueLabelY(top, PAD_TOP).toFixed(1)}" font-size="6.5" font-weight="600" fill="var(--accent)" text-anchor="middle">${fmtNum(m.balance)}</text>`;
  });

  const lineFor = (key, yOf, color) => {
    const pts = months.map((m, i) => `${xOfCenter(i).toFixed(1)},${yOf(m[key]).toFixed(1)}`).join(" ");
    const dots = months.map((m, i) => `<circle cx="${xOfCenter(i).toFixed(1)}" cy="${yOf(m[key]).toFixed(1)}" r="2" fill="${color}" />`).join("");
    return `<polyline points="${pts}" fill="none" stroke="${color}" stroke-width="1.75" stroke-linejoin="round" stroke-linecap="round" />${dots}`;
  };

  svg.innerHTML = `
    <line x1="${PAD_L}" y1="${zeroYBal.toFixed(1)}" x2="${W - PAD_R}" y2="${zeroYBal.toFixed(1)}" stroke="var(--border)" stroke-width="1" />
    ${bars}
    ${barLabels}
    ${lineFor("expense", expenseY, "var(--expense)")}
    ${lineFor("income", incomeY, "var(--income)")}
    ${lineFor("investment", investmentY, "var(--invest)")}
    <text x="${xOfCenter(0).toFixed(1)}" y="${H - 6}" font-size="10" fill="var(--text-dim)" text-anchor="start">${firstLabel}</text>
    <text x="${xOfCenter(n - 1).toFixed(1)}" y="${H - 6}" font-size="10" fill="var(--text-dim)" text-anchor="end">${lastLabel}</text>`;
}

function renderChart() {
  document.querySelectorAll("#chartMetricFilter .chip").forEach(c => {
    c.classList.toggle("active", c.dataset.metric === state.chartMetric);
  });

  const metric = state.chartMetric;
  const chartEl = document.getElementById("chartSvg");
  const emptyMsg = document.getElementById("chartEmpty");
  const listEl = document.getElementById("chartList");
  const totalLabel = document.getElementById("chartTotalLabel");
  const legendEl = document.getElementById("chartLegend");

  if (state.assetsMonths.length === 0 || !state.chartStartMonth || !state.chartEndMonth) {
    emptyMsg.style.display = "block";
    chartEl.innerHTML = "";
    legendEl.style.display = "none";
    totalLabel.textContent = "0원";
    listEl.innerHTML = "";
    return;
  }
  emptyMsg.style.display = "none";

  const byKey = {};
  state.assetsMonths.forEach(m => { byKey[m.monthKey] = m; });

  // 잔고는 사용자가 수기로 입력한 자산 값을 그대로 쓰되, 입력이 없는 달은
  // 직전에 입력된 값을 그대로 이어간다(carry-forward). 아직 한 번도
  // 입력하지 않았다면 0으로 취급한다.
  const earliestKey = state.assetsMonths[0].monthKey;
  const historyStart = earliestKey < state.chartEndMonth ? earliestKey : state.chartEndMonth;
  const fullRangeKeys = buildMonthRange(historyStart, state.chartEndMonth);

  let lastAsset = 0;
  let lastItemValues = {};
  const fullRange = fullRangeKeys.map(key => {
    const d = byKey[key] || { expense: 0, income: 0, investment: 0, asset: null, expenseByCat: {}, incomeByCat: {}, investmentByCat: {}, itemValues: {} };
    if (d.asset != null) lastAsset = d.asset;
    Object.keys(d.itemValues || {}).forEach(itemId => {
      if (d.itemValues[itemId] != null) lastItemValues[itemId] = d.itemValues[itemId];
    });
    // 자산 분류별 금액도 항목별 carry-forward 값을 기준으로 계산한다.
    const assetByCat = {};
    state.assetItems.forEach(it => {
      const v = lastItemValues[it.id];
      if (v != null) assetByCat[it.categoryId] = (assetByCat[it.categoryId] || 0) + Number(v);
    });
    return {
      monthKey: key, expense: d.expense, income: d.income, investment: d.investment, balance: lastAsset,
      expenseByCat: d.expenseByCat || {}, incomeByCat: d.incomeByCat || {}, investmentByCat: d.investmentByCat || {},
      assetByCat,
    };
  });

  const byKeyFull = {};
  fullRange.forEach(m => { byKeyFull[m.monthKey] = m; });
  const months = buildMonthRange(state.chartStartMonth, state.chartEndMonth).map(key => byKeyFull[key]);

  if (metric === "all") {
    legendEl.style.display = "flex";
    const latest = months[months.length - 1].balance;
    totalLabel.textContent = `${latest < 0 ? "-" : ""}${fmtNum(Math.abs(latest))}원`;
    renderComboChart(chartEl, months);
  } else {
    legendEl.style.display = "none";
    const series = months.map(m => ({ monthKey: m.monthKey, value: m[metric] }));
    const latest = series[series.length - 1].value;
    totalLabel.textContent = `${latest < 0 ? "-" : ""}${fmtNum(Math.abs(latest))}원`;
    renderTrendChart(chartEl, series, metric);
  }

  listEl.innerHTML = months.slice().reverse().map(m => {
    let sign, amt, cls;
    if (metric === "all" || metric === "balance") {
      sign = m.balance < 0 ? "-" : "+";
      amt = Math.abs(m.balance);
      cls = m.balance < 0 ? "expense" : "income";
    } else if (metric === "expense") {
      sign = "-"; amt = m.expense; cls = "expense";
    } else if (metric === "income") {
      sign = "+"; amt = m.income; cls = "income";
    } else {
      sign = "+"; amt = m.investment; cls = "investment";
    }
    const expanded = state.chartExpandedMonths.has(m.monthKey);
    let breakdownHtml = "";
    if (expanded) {
      if (metric === "all") {
        const balSign = m.balance < 0 ? "-" : "+";
        breakdownHtml = `
          <div class="cat-entries">
            <div class="cat-entry-row"><span class="entry-memo">자산</span><span class="amt ${m.balance < 0 ? "expense" : "income"}">${balSign}${fmtNum(Math.abs(m.balance))}원</span></div>
            <div class="cat-entry-row"><span class="entry-memo">지출</span><span class="amt expense">-${fmtNum(m.expense)}원</span></div>
            <div class="cat-entry-row"><span class="entry-memo">수입</span><span class="amt income">+${fmtNum(m.income)}원</span></div>
            <div class="cat-entry-row"><span class="entry-memo">투자</span><span class="amt investment">+${fmtNum(m.investment)}원</span></div>
          </div>`;
      } else if (metric === "balance") {
        // 자산 분류별 금액만 표시 (분류 하위 항목은 표시하지 않는다)
        const rows = state.assetCategories
          .map(cat => ({ label: cat.label, amt: m.assetByCat[cat.id] || 0 }))
          .filter(r => r.amt > 0)
          .sort((a, b) => b.amt - a.amt)
          .map(r => `<div class="cat-entry-row"><span class="entry-memo">${escapeHtml(r.label)}</span><span class="amt income">${fmtNum(r.amt)}원</span></div>`)
          .join("");
        breakdownHtml = `<div class="cat-entries">${rows || `<div class="day-detail-empty">분류별 데이터가 없습니다.</div>`}</div>`;
      } else {
        // 지출/수입/투자: 카테고리별 금액만 표시 (카테고리 내 개별 내역은 표시하지 않는다)
        const catDefs = categoriesForLedger(state.currentLedger)[metric] || [];
        const byCat = m[`${metric}ByCat`] || {};
        const rowSign = metric === "expense" ? "-" : "+";
        const rows = Object.keys(byCat)
          .map(catId => {
            const def = catDefs.find(c => c.id === catId);
            return { label: def ? def.label : catId, amt: byCat[catId] };
          })
          .filter(r => r.amt > 0)
          .sort((a, b) => b.amt - a.amt)
          .map(r => `<div class="cat-entry-row"><span class="entry-memo">${escapeHtml(r.label)}</span><span class="amt ${metric}">${rowSign}${fmtNum(r.amt)}원</span></div>`)
          .join("");
        breakdownHtml = `<div class="cat-entries">${rows || `<div class="day-detail-empty">카테고리별 데이터가 없습니다.</div>`}</div>`;
      }
    }
    return `
      <div class="cat-row-wrap">
        <button class="cat-row" data-month="${m.monthKey}">
          <span class="icon">🗓️</span>
          <span class="name">${monthLabelOf(m.monthKey)}</span>
          <span class="amt ${cls}">${sign}${fmtNum(amt)}원</span>
          <span class="chevron">${expanded ? "▲" : "▼"}</span>
        </button>
        ${breakdownHtml}
      </div>`;
  }).join("");

  listEl.querySelectorAll(".cat-row[data-month]").forEach(btn => {
    btn.addEventListener("click", () => {
      const key = btn.dataset.month;
      if (state.chartExpandedMonths.has(key)) state.chartExpandedMonths.delete(key);
      else state.chartExpandedMonths.add(key);
      renderChart();
    });
  });
}

document.getElementById("chartMetricFilter").addEventListener("click", (e) => {

function updatePayerFieldVisibility() {
  const wrap = document.getElementById("payerFieldWrap");
  // 자산 내역은 "결제자" 개념이 없으므로 어느 가계부든 선택 UI를 숨긴다.
